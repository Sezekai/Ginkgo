name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build Ginkgo.sln -c Release
      - name: Test
        run: dotnet run --project tests/Ginkgo.Core.Tests -c Release
      - name: Get ffmpeg and ffprobe (video thumbnails and lengths)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x
          New-Item -ItemType Directory -Force tools | Out-Null
          Copy-Item (Get-ChildItem ffmpeg-x -Recurse -Directory -Filter bin | Select-Object -First 1).FullName\* tools\
          Get-ChildItem tools | Select-Object Name, Length
      - name: Data tests (scan, index, thumbnails on generated images)
        env:
          GINKGO_TOOLS: ${{ github.workspace }}\tools
        run: dotnet run --project tests/Ginkgo.Data.Tests -c Release
      - name: Thumbnail loader benchmark
        continue-on-error: true
        run: dotnet run --project tests/Ginkgo.App.Bench -c Release
      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish src/Ginkgo.App -c Release -r win-x64 --self-contained true -o publish/Ginkgo
          New-Item -ItemType Directory -Force publish/Ginkgo/tools | Out-Null
          Copy-Item tools\ffmpeg.exe, tools\ffprobe.exe, tools\*.dll publish/Ginkgo/tools/
      - name: Latest build as a download (Releases page)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path publish/Ginkgo/* -DestinationPath Ginkgo-win-x64.zip -Force
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest Ginkgo-win-x64.zip --prerelease --target $env:GITHUB_SHA --title "Latest build" --notes "Built from $env:GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Ginkgo-win-x64
          path: publish/Ginkgo
          retention-days: 4
