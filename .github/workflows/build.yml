name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build Ginkgo.sln -c Release
      - name: Test
        run: dotnet run --project tests/Ginkgo.Core.Tests -c Release
      - name: Data tests (scan, index, thumbnails on generated images)
        run: dotnet run --project tests/Ginkgo.Data.Tests -c Release
      - name: Publish prototype
        run: dotnet publish src/Ginkgo.Prototype -c Release -r win-x64 --self-contained true -o publish/Ginkgo.Prototype
      - uses: actions/upload-artifact@v4
        with:
          name: Ginkgo.Prototype-win-x64
          path: publish/Ginkgo.Prototype
