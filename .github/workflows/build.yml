name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build Ginkgo.sln -c Release
      - name: Test
        run: dotnet run --project tests/Ginkgo.Core.Tests -c Release
      - name: Get ffmpeg and ffprobe (video thumbnails and lengths)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          try {
            $rel = Invoke-RestMethod https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
            $asset = $rel.assets | Where-Object { $_.name -match 'win64-lgpl-shared' -and $_.name -match 'master' -and $_.name -like '*.zip' } | Select-Object -First 1
            if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -match 'win64-lgpl-shared' -and $_.name -like '*.zip' } | Select-Object -First 1 }
            if (-not $asset) { Write-Host "::error::no ffmpeg asset; have: $(($rel.assets | ForEach-Object name) -join ', ')"; exit 1 }
            Write-Host "::notice::ffmpeg from $($asset.name)"
            # the download host sometimes times out: try a few times
            for ($try = 1; $try -le 6; $try++) {
              try { Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ffmpeg.zip; break }
              catch { if ($try -eq 6) { throw }; Write-Host "download attempt $try failed: $($_.Exception.Message); trying again"; Start-Sleep -Seconds (20 * $try) }
            }
            Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x
            $bin = Get-ChildItem ffmpeg-x -Recurse -Directory -Filter bin | Select-Object -First 1
            New-Item -ItemType Directory -Force tools | Out-Null
            Copy-Item -Path (Join-Path $bin.FullName '*') -Destination tools
            Write-Host "::notice::tools: $((Get-ChildItem tools | ForEach-Object { $_.Name }) -join ', ')"
          } catch { Write-Host "::error::getting ffmpeg failed: $($_.Exception.Message)"; exit 1 }
      - name: Data tests (scan, index, thumbnails on generated images)
        env:
          GINKGO_TOOLS: ${{ github.workspace }}\tools
        run: dotnet run --project tests/Ginkgo.Data.Tests -c Release
      - name: Thumbnail loader benchmark
        continue-on-error: true
        run: dotnet run --project tests/Ginkgo.App.Bench -c Release
      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish src/Ginkgo.App -c Release -r win-x64 --self-contained true -o publish/Ginkgo
          New-Item -ItemType Directory -Force publish/Ginkgo/tools | Out-Null
          Copy-Item tools\ffmpeg.exe, tools\ffprobe.exe, tools\*.dll publish/Ginkgo/tools/
      - name: Start-up check (opens the published app on a small library, runs 15 s, closes)
        shell: pwsh
        run: |
          $lib = Join-Path $env:RUNNER_TEMP 'smoke-lib'; $cache = Join-Path $env:RUNNER_TEMP 'smoke-cache'
          New-Item -ItemType Directory -Force "$lib\Art\Set A", "$lib\Photos", $cache | Out-Null
          1..4 | ForEach-Object { Copy-Item src/Ginkgo.App/Assets/ginkgo.png "$lib\Art\Set A\pic $_.png"; Copy-Item src/Ginkgo.App/Assets/ginkgo.png "$lib\Photos\p$_.png" }
          $data = Join-Path $env:LOCALAPPDATA 'Ginkgo'; New-Item -ItemType Directory -Force $data | Out-Null
          @{ LibraryRoot = $lib; CacheDir = $cache; FolderRulesVersion = 3; MemoryRulesVersion = 1 } | ConvertTo-Json | Set-Content (Join-Path $data 'settings.json')
          $p = Start-Process publish/Ginkgo/Ginkgo.exe -ArgumentList '--smoke' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "::error::Ginkgo did not close within 2 minutes"; exit 1 }
          $log = Join-Path $data 'crash.log'
          if (Test-Path $log) { Get-Content $log; }
          if ($p.ExitCode -ne 0) { Write-Host "::error::Ginkgo failed to start (exit code $($p.ExitCode))"; exit 1 }
          Write-Host "::notice::Ginkgo started and closed cleanly"
      - name: Latest build as a download (Releases page)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path publish/Ginkgo/* -DestinationPath Ginkgo-win-x64.zip -Force
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest Ginkgo-win-x64.zip --prerelease --target $env:GITHUB_SHA --title "Latest build" --notes "Built from $env:GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Ginkgo-win-x64
          path: publish/Ginkgo
          retention-days: 4
